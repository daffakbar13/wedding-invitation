<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 800" preserveAspectRatio="none">
  <!-- Sage velvet curtain panel; folds compress when the panel is scaled on X -->
  <defs>
    <linearGradient id="folds" x1="0" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#55654A"/>
      <stop offset=".28" stop-color="#8A9A7B"/>
      <stop offset=".5" stop-color="#A9B79C"/>
      <stop offset=".74" stop-color="#76866A"/>
      <stop offset="1" stop-color="#55654A"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F3A28" stop-opacity=".35"/>
      <stop offset=".18" stop-color="#2F3A28" stop-opacity="0"/>
      <stop offset=".82" stop-color="#2F3A28" stop-opacity="0"/>
      <stop offset="1" stop-color="#2F3A28" stop-opacity=".3"/>
    </linearGradient>
  </defs>
  <rect width="200" height="800" fill="url(#folds)"/>
  <rect width="200" height="800" fill="url(#shade)"/>
  <rect y="784" width="200" height="5" fill="#C9AB74" opacity=".85"/>
  <rect y="792" width="200" height="2" fill="#C9AB74" opacity=".6"/>
</svg>
